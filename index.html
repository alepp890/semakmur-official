    <!-- SCRIPT MOBILE DETECTION (PENGESAN PERANTI PENENTU WORKFLOW MOBILE VS DESKTOP) -->
    <script>
        (function checkMobileWorkflow() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
            const urlParams = new URLSearchParams(window.location.search);
            const viewMode = urlParams.get('mode');

            // Jika buka di peranti mobile DAN tiada arahan paksa lihat portal awam (?mode=portal)
            if (isMobile && viewMode !== 'portal') {
                window.location.href = 'LoginSession.html';
            }
        })();

        function fixGoogleDriveImageUrl(url) {
            if (!url || typeof url !== 'string') return 'https://picsum.photos/600/400?random=1';
            if (url.startsWith('data:image') || url.startsWith('blob:')) return url;

            let fileId = null;
            const match1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match1 && match1[1]) fileId = match1[1];

            if (!fileId) {
                const match2 = url.match(/id=([a-zA-Z0-9_-]+)/);
                if (match2 && match2[1]) fileId = match2[1];
            }

            if (fileId) {
                return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
            }
            return url;
        }

        function formatDateDisplay(dateStr) {
            if (!dateStr) return '-';
            try {
                let d = new Date(dateStr);
                if (isNaN(d.getTime())) {
                    if (typeof dateStr === 'string' && dateStr.includes('-')) {
                        const parts = dateStr.split('T')[0].split('-');
                        if (parts.length === 3) {
                            d = new Date(parts[0], parts[1] - 1, parts[2]);
                        }
                    }
                }
                if (!isNaN(d.getTime())) {
                    return d.toLocaleDateString('ms-MY', { day: '2-digit', month: 'short', year: 'numeric' });

            } catch (e) {}
            return dateStr;

        function showLoader(txt = "Memuatkan data...") {
            const loader = document.getElementById('global-loader');
            const lTxt = document.getElementById('loader-text');
            if (lTxt) lTxt.innerText = txt;
            if (loader) loader.classList.remove('hidden');
        }

        function hideLoader() {
            const loader = document.getElementById('global-loader');
            if (loader) loader.classList.add('hidden');
        }

        async function fetchPortalData() {
            showLoader("Menghubungi pangkalan data Google Sheets...");
            try {
                const response = await fetch(`${WEB_APP_URL}?action=getPortalData`);
                const result = await response.json();
                hideLoader();

                if (result.success) {
                    APP_DATA = result;
                    
                    if (result.posts && Array.isArray(result.posts) && result.posts.length > 0) {
                        DEMO_POSTS_DATA = result.posts
                            .filter(p => p.sub_kategori === 'berita_pengumuman' || !p.sub_kategori)
                            .map(p => ({
                                ...p,
                                tarikh: formatDateDisplay(p.tarikh),
                                banner_img: fixGoogleDriveImageUrl(p.banner_img)
                            }));

                        DEMO_BULETIN_DATA = result.posts
                            .filter(p => p.sub_kategori === 'buletin_majalah')
                            .map(p => ({
                                ...p,
                                tarikh: formatDateDisplay(p.tarikh),
                                banner_img: fixGoogleDriveImageUrl(p.banner_img)
                            }));
                    } else {
                        DEMO_POSTS_DATA = DUMMY_POSTS;
                        DEMO_BULETIN_DATA = DUMMY_BULETIN;
                    }

                    if (result.gallery && Array.isArray(result.gallery) && result.gallery.length > 0) {
                        DEMO_GALLERY_DATA = result.gallery.map(g => {
                            let rawImages = typeof g.gambar_json === 'string' ? JSON.parse(g.gambar_json) : (g.gambar_json || []);
                            let fixedImages = Array.isArray(rawImages) ? rawImages.map(img => fixGoogleDriveImageUrl(img)) : [];
                            return {
                                id: g.id,
                                tajuk: g.tajuk,
                                tarikh: formatDateDisplay(g.tarikh),
                                jumlah_foto: g.jumlah_foto || fixedImages.length,
                                penerangan: g.penerangan || '',
                                gambar: fixedImages
                            };
                        });
                    } else {
                        DEMO_GALLERY_DATA = DUMMY_GALLERY;
                    }

                    if (result.menuStructure) {
                        for (let modKey in result.menuStructure) {
                            if (modKey !== 'info_galeri' && MENU_STRUCTURE[modKey]) {
                                let rawItems = result.menuStructure[modKey];
                                if (typeof rawItems === 'string') {
                                    try { rawItems = JSON.parse(rawItems); } catch(e) { rawItems = []; }
                                }
                                MENU_STRUCTURE[modKey].items = Array.isArray(rawItems) ? rawItems : [];
                            }
                        }
                    }

                    if (result.quickLinks && result.quickLinks.length > 0) {
                        QUICK_LINKS_DATA = result.quickLinks;
                    }

                    if (result.sidebarConfig && Object.keys(result.sidebarConfig).length > 0) {
                        SIDEBAR_CONFIG_DATA = { ...SIDEBAR_CONFIG_DATA, ...result.sidebarConfig };
                    }

                    if (result.sidebarOrder) {
                        SIDEBAR_WIDGET_ORDER = typeof result.sidebarOrder === 'string' ? JSON.parse(result.sidebarOrder) : result.sidebarOrder;
                    }

                    if (result.stats) {
                        SCHOOL_STATS = result.stats;
                    }

                    renderHeaderNav();
                    renderPublicSidebarWidgets();
                    renderQuickLinks();
                    handleUrlRouting();
                    
                    showToast("Data portal berjaya dimuatkan!");
                } else {
                    showToast("Gagal memuatkan data backend: " + result.error, "error");
                }
            } catch (err) {
                hideLoader();
                console.error("Fetch GET Error:", err);
                DEMO_POSTS_DATA = DUMMY_POSTS;
                DEMO_BULETIN_DATA = DUMMY_BULETIN;
                DEMO_GALLERY_DATA = DUMMY_GALLERY;
                renderHeaderNav();
                renderPublicSidebarWidgets();
                renderQuickLinks();
                handleUrlRouting();
                showToast("Ralat sambungan backend. Portal memuatkan data laluan sementara.", "error");
            }
        }

        function handleUrlRouting() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetMod = urlParams.get('mod');
            const targetPost = urlParams.get('post');

            if (targetPost) {
                openFullPostView(targetPost);
            } else if (targetMod && MENU_STRUCTURE[targetMod]) {
                CURRENT_MODULE = targetMod;
                loadModule(targetMod, false);
            } else {
                loadModule('utama', false);
            }
        }

        }

        function loadModule(modName, autoScroll = true) {
            CURRENT_MODULE = modName;
            closeFullGalleryView();
            renderBanner(modName);
            renderQuickLinks();
            updateHeaderNavActiveState(modName);

            const sidebar = document.getElementById('sidebar-info');
            const mainContent = document.getElementById('main-content');
            const quickLinksWrapper = document.getElementById('quick-links-wrapper');

            if (quickLinksWrapper) {
                if (modName === 'utama') {
                    quickLinksWrapper.classList.remove('hidden');
                } else {
                    quickLinksWrapper.classList.add('hidden');
                }
            }
            
            const SPECIAL_LINK_PAGES = ['e-tmk', 'e-pbd', 'e-mampan', 'e-banksoalan', 'e-pibg'];

            if (SPECIAL_LINK_PAGES.includes(modName)) {
                if (sidebar) sidebar.classList.add('hidden');
            } else {
                if (sidebar) sidebar.classList.remove('hidden');
            }

            if (modName === 'utama') {
                renderUtama(mainContent);
                if (autoScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (modName === 'e-tmk') {
                renderETMKPage(mainContent);
                if (autoScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (modName === 'e-pbd') {
                renderEPBDPage(mainContent);
                if (autoScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (modName === 'e-mampan') {
                renderEMampanPage(mainContent);
                if (autoScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (modName === 'e-banksoalan') {
                renderEBankSoalanPage(mainContent);
                if (autoScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (modName === 'e-pibg') {
                renderEPIBGPage(mainContent);
                if (autoScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                switchSubTab(CURRENT_SUB_MODULE);
                if (autoScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;

            const toast = document.createElement('div');
            toast.className = `toast-enter pointer-events-auto px-4 py-3 rounded-2xl text-xs font-extrabold text-white shadow-xl flex items-center gap-2 ${type==='success'?'bg-emerald-600':'bg-red-600'}`;
            toast.innerHTML = `<span>${type==='success'?'✅':'⚠️'}</span><span>${msg}</span>`;
            container.appendChild(toast);

            setTimeout(() => { toast.remove(); }, 3500);
        }

        function updateDateTime() {
            const el = document.getElementById('header-datetime');
            if (!el) return;
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            el.innerHTML = `<span>🕒 ${now.toLocaleDateString('ms-MY', options)}</span>`;
        }

        setInterval(updateDateTime, 1000);

        /* INITIALIZE APP ON LOAD */
        window.addEventListener('DOMContentLoaded', () => {
            fetchPortalData();
            startHebahanAuto();
        });
    </script>
</body>
