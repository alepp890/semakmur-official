<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk - Portal Rasmi Sekolah</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Sambungan Awal ke Servis Google -->
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://drive.google.com">
    <link rel="dns-prefetch" href="https://script.google.com">
    <link rel="dns-prefetch" href="https://drive.google.com">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        brandDark: '#0F172A',       /* Slate Navy Deep */
                        brandNavy: '#1E3A8A',       /* Medium Navy */
                        brandAccent: '#2563EB',     /* Blue Accent */
                        brandGold: '#D97706',       /* Amber Gold */
                        brandBg: '#F8FAFC',         /* Clean Slate Light */
                        brandBorder: '#E2E8F0'      /* Modern Border */
                    },
                    fontFamily: { 
                        sans: ['Plus Jakarta Sans', 'sans-serif'] 
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #0F172A; 
            color: #0F172A; 
            font-size: 15px;
            line-height: 1.6;
        }

        /* Modern Glassmorphic Card */
        .card-custom {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.3);
            border-radius: 1.5rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Gradient Glow Buttons */
        .btn-gradient-dark {
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
            transition: all 0.25s ease;
        }
        .btn-gradient-dark:hover {
            background: linear-gradient(135deg, #334155 0%, #1E293B 100%);
            box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.4);
        }

        .loader-spinner {
            border: 4px solid #CBD5E1; 
            border-top: 4px solid #2563EB;
            border-radius: 50%; 
            width: 44px; 
            height: 44px; 
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-brandDark to-brandNavy antialiased min-h-screen flex items-center justify-center p-4 selection:bg-brandNavy selection:text-white">

    <!-- GLOBAL LOADER & TOAST -->
    <div id="global-loader" class="fixed inset-0 bg-brandDark/85 backdrop-blur-md z-[9999] flex flex-col items-center justify-center hidden">
        <div class="loader-spinner mb-4"></div>
        <p class="text-white text-center font-bold text-base drop-shadow-md" id="loader-text">Memuatkan sistem...</p>
    </div>

    <div id="toast-container" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

    <!-- TETINGKAP MODAL PILIHAN DASHBOARD (KHAS UNTUK SISTEM_AKSES = ADMIN) -->
    <div id="admin-choice-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[9990] flex items-center justify-center p-4 hidden">
        <div class="card-custom w-full max-w-md p-6 bg-white text-center space-y-5 animate-scale-up">
            <div class="w-14 h-14 bg-blue-50 text-brandAccent rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner border border-blue-100">
                ⚙️
            </div>
            <div>
                <h3 class="text-lg font-black text-brandDark">Akses Pentadbir Dikesan</h3>
                <p class="text-xs text-slate-500 font-medium mt-1">Sila pilih dashboard yang ingin anda akses untuk sesi ini:</p>
            </div>
            <div class="space-y-3 pt-2">
                <button onclick="selectAdminDashboard('admin')" class="w-full py-3.5 px-4 bg-gradient-to-r from-brandNavy to-brandDark text-white font-extrabold text-xs sm:text-sm rounded-2xl shadow-lg hover:opacity-95 transition flex items-center justify-center gap-2">
                    <span>⚙️</span> <span>Dashboard Pentadbir (Admin)</span>
                </button>
                <button onclick="selectAdminDashboard('guru')" class="w-full py-3.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-800 font-extrabold text-xs sm:text-sm rounded-2xl transition flex items-center justify-center gap-2 border border-slate-200">
                    <span>👨‍🏫</span> <span>Dashboard Guru</span>
                </button>
            </div>
        </div>
    </div>

    <!-- KAD LOG MASUK UTAMA -->
    <div class="card-custom w-full max-w-md p-8 relative z-10 mx-auto bg-white rounded-3xl my-8">
        
        <!-- Butang Kembali Ke Portal Awam -->
        <a href="index.html?mode=portal" class="absolute top-5 right-5 text-slate-400 hover:text-brandDark transition flex items-center gap-1 text-xs font-bold" title="Kembali ke Portal Awam">
            <span>Portal</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </a>

        <div class="text-center mb-6">
            <div class="h-14 w-14 bg-gradient-to-tr from-brandDark via-brandNavy to-brandAccent text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg border border-white/20">
                <svg class="w-7 h-7 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-xl font-black text-brandDark">Log Masuk Portal Sekolah</h1>
            <p class="text-xs text-slate-500 font-medium mt-1">Pusat Akses Warga Sekolah & Waris</p>
        </div>

        <!-- 1. BUTANG UTAMA: LOG MASUK AKAUN MOE (GOOGLE AUTH) -->
        <div class="mb-6">
            <button onclick="loginWithMOE()" type="button" class="w-full py-3.5 px-4 rounded-2xl bg-white border-2 border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 text-slate-700 font-extrabold text-xs sm:text-sm shadow-xs transition flex items-center justify-center gap-3 group">
                <!-- Google SVG Icon Rasmi -->
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Log Masuk Dengan Akaun MOE</span>
            </button>
            <div class="relative flex py-4 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Atau Guna E-mel</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>
        </div>

        <!-- 2. BORANG LOG MASUK MANUAL (EMEL & KATA LALUAN) -->
        <form id="login-form" onsubmit="handleManualLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-black text-brandDark uppercase tracking-wider mb-1.5">Alamat E-mel / ID Pengguna</label>
                <input type="email" id="login-email" required placeholder="Contoh: nama@sekolah.edu.my / waris@gmail.com" class="w-full px-4 py-3 rounded-2xl border border-brandBorder focus:border-brandAccent focus:ring-2 focus:ring-brandAccent/20 outline-none bg-slate-50 text-sm font-medium">
            </div>
            <div>
                <label class="block text-xs font-black text-brandDark uppercase tracking-wider mb-1.5">Kata Laluan</label>
                <input type="password" id="login-pass" required placeholder="••••••••" class="w-full px-4 py-3 rounded-2xl border border-brandBorder focus:border-brandAccent focus:ring-2 focus:ring-brandAccent/20 outline-none bg-slate-50 text-sm font-medium">
            </div>
            <button type="submit" class="btn-gradient-dark w-full py-3.5 px-4 text-white font-extrabold text-xs sm:text-sm rounded-2xl shadow-lg transition">
                Log Masuk Sistem
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center">
            <a href="index.html?mode=portal" class="text-xs font-bold text-brandAccent hover:underline flex items-center justify-center gap-1">
                <span>⬅️ Kembali Ke Portal Awam Utama</span>
            </a>
        </div>
    </div>

    <!-- SAMBUNGAN FAIL CONFIG BACKEND -->
    <script src="config.js"></script>

    <!-- LOGIK JAVASCRIPT LOG MASUK -->
    <script>
        let PENDING_ADMIN_USER = null;

        function showLoader(txt = "Memuatkan sistem...") {
            const loader = document.getElementById('global-loader');
            const lTxt = document.getElementById('loader-text');
            if (lTxt) lTxt.innerText = txt;
            if (loader) loader.classList.remove('hidden');
        }

        function hideLoader() {
            const loader = document.getElementById('global-loader');
            if (loader) loader.classList.add('hidden');
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;

            const toast = document.createElement('div');
            toast.className = `toast-enter pointer-events-auto px-4 py-3 rounded-2xl text-xs font-extrabold text-white shadow-xl flex items-center gap-2 ${type==='success'?'bg-emerald-600':'bg-red-600'}`;
            toast.innerHTML = `<span>${type==='success'?'✅':'⚠️'}</span><span>${msg}</span>`;
            container.appendChild(toast);

            setTimeout(() => { toast.remove(); }, 4500);
        }

        /* 1. SEMAKAN SESI PANTAS (FAST LOGIN / CACHED SESSION) */
        function checkFastLogin() {
            const savedUser = localStorage.getItem('SAVED_MOE_USER') || sessionStorage.getItem('CURRENT_USER');
            if (savedUser) {
                try {
                    const user = JSON.parse(savedUser);
                    if (user && user.email) {
                        if (user.is_admin) {
                            PENDING_ADMIN_USER = user;
                            document.getElementById('admin-choice-modal').classList.remove('hidden');
                            return;
                        } else if (user.role === 'guru') {
                            window.location.href = 'DashboardGuru.html';
                            return;
                        } else if (user.role === 'parent') {
                            window.location.href = 'DashboardParent.html';
                            return;
                        } else if (user.role === 'admin') {
                            window.location.href = 'DashboardAdmin.html';
                            return;
                        }
                    }
                } catch(e) {}
            }
            checkUrlParameters();
        }

        /* 2. LOG MASUK MOE GOOGLE AUTH */
        function loginWithMOE() {
            showLoader("Melencongkan ke pengesahan Google MOE...");
            window.location.href = `${WEB_APP_URL}?action=googleLogin`;
        }

        /* 3. SEMAKAN PARAMETER RALAT & DATA TERUS DARI URL */
        function checkUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const err = urlParams.get('error');
            const authData = urlParams.get('authData');

            if (err === 'not_moe_email') {
                showToast("Anda tidak menggunakan e-mel MOE. Sila log masuk menggunakan ruang borang e-mel di bawah.", "error");
            } else if (err === 'email_not_found') {
                showToast("Akaun e-mel MOE anda tidak dijumpai dalam pangkalan data sistem. Sila log masuk menggunakan e-mel lain atau gunakan ruang borang di bawah.", "error");
            } else if (err === 'no_email') {
                showToast("Pengesahan Google gagal atau e-mel tidak dapat dikesan.", "error");
            }

            if (authData) {
                try {
                    const user = JSON.parse(decodeURIComponent(authData));
                    if (user) {
                        localStorage.setItem('SAVED_MOE_USER', JSON.stringify(user));
                        sessionStorage.setItem('CURRENT_USER', JSON.stringify(user));

                        if (user.is_admin) {
                            PENDING_ADMIN_USER = user;
                            document.getElementById('admin-choice-modal').classList.remove('hidden');
                        } else if (user.role === 'guru') {
                            window.location.href = 'DashboardGuru.html';
                        } else if (user.role === 'parent') {
                            window.location.href = 'DashboardParent.html';
                        }
                    }
                } catch(e) {}
            }
        }

        /* 4. PILIHAN DASHBOARD KHAS ADMIN */
        function selectAdminDashboard(choice) {
            if (!PENDING_ADMIN_USER) return;
            
            const userToSave = { ...PENDING_ADMIN_USER };
            if (choice === 'admin') {
                userToSave.role = 'admin';
                sessionStorage.setItem('CURRENT_USER', JSON.stringify(userToSave));
                window.location.href = 'DashboardAdmin.html';
            } else {
                userToSave.role = 'guru';
                sessionStorage.setItem('CURRENT_USER', JSON.stringify(userToSave));
                window.location.href = 'DashboardGuru.html';
            }
        }

        /* 5. LOG MASUK MANUAL (EMEL & KATA LALUAN) */
        async function handleManualLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-pass').value.trim();

            showLoader("Menyemak padanan e-mel & kata laluan...");
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'manualLogin',
                        data: { email, password }
                    })
                });

                const res = await response.json();
                hideLoader();

                if (res.success) {
                    const user = res.user;
                    localStorage.setItem('SAVED_MOE_USER', JSON.stringify(user));
                    sessionStorage.setItem('CURRENT_USER', JSON.stringify(user));

                    showToast(`Selamat datang, ${user.name || 'Pengguna'}!`);

                    setTimeout(() => {
                        if (user.is_admin) {
                            PENDING_ADMIN_USER = user;
                            document.getElementById('admin-choice-modal').classList.remove('hidden');
                        } else if (user.role === 'guru') {
                            window.location.href = 'DashboardGuru.html';
                        } else if (user.role === 'parent') {
                            window.location.href = 'DashboardParent.html';
                        } else if (user.role === 'admin') {
                            window.location.href = 'DashboardAdmin.html';
                        }
                    }, 500);
                } else {
                    showToast(res.error || "Log masuk gagal. Sila semak e-mel dan kata laluan anda.", "error");
                }
            } catch (err) {
                hideLoader();
                console.error("Manual Login Error:", err);
                showToast("Ralat sambungan ke pangkalan data!", "error");
            }
        }

        /* AMBIL BACAAN SESI PADA MULANNYA */
        window.addEventListener('DOMContentLoaded', checkFastLogin);
    </script>
</body>
</html>
