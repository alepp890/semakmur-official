<!DOCTYPE html>
<html lang="ms" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Manual Pengurusan Sekolah - SeMAKMUR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        tealTheme: '#1f7a9c',
                        tealDark: '#175d78',
                        tealLight: '#2ca2cd',
                        tealBg: '#eef6f9'
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        html, body { height: 100%; margin: 0; background-color: #EEF6F9; font-family: 'Plus Jakarta Sans', sans-serif; }
        .card-book { background: #FFFFFF; border-radius: 1rem; border: 1px solid #E2E8F0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .loader-ring { display: inline-block; position: relative; width: 44px; height: 44px; }
        .loader-ring div { box-sizing: border-box; display: block; position: absolute; width: 34px; height: 34px; margin: 5px; border: 3.5px solid #1f7a9c; border-radius: 50%; animation: loader-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite; border-color: #1f7a9c transparent transparent transparent; }
        @keyframes loader-ring { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#eef6f9] text-slate-800 h-full flex flex-col antialiased">

    <!-- GLOBAL LOADER -->
    <div id="global-loader" class="fixed inset-0 bg-slate-900/70 backdrop-blur-xs z-[9999] flex flex-col items-center justify-center transition-all duration-200">
        <div class="loader-ring mb-3"><div></div><div></div><div></div></div>
        <p class="text-white font-bold text-sm tracking-wide" id="loader-text">Memuatkan Buku Pengurusan...</p>
    </div>

    <!-- HEADER / NAVIGATION -->
    <header class="h-20 bg-white border-b border-slate-200 shrink-0 flex items-center justify-between px-6 z-20 shadow-xs">
        <div class="flex items-center gap-3">
            <a href="../DashboardGuru.html" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition flex items-center justify-center">
                <i class="fa-solid fa-arrow-left text-base"></i>
            </a>
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#1f7a9c] to-[#2ca2cd] text-white flex items-center justify-center text-xl shadow-xs font-bold">
                    📖
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-extrabold text-slate-800 tracking-tight leading-tight">Buku Manual Pengurusan Sekolah</h1>
                    <p class="text-[11px] text-[#1f7a9c] font-bold tracking-wide uppercase">Mod Pengurusan Interaktif Berkad</p>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <span class="px-3 py-1 bg-teal-100 text-[#1f7a9c] font-extrabold text-xs rounded-full">Sistem DB V2 Active</span>
        </div>
    </header>

    <!-- KANDUNGAN UTAMA (BUKU INTERAKTIF) -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 max-w-7xl mx-auto w-full">

        <!-- TAB BAB UTAMA BUKU -->
        <div class="flex flex-wrap items-center gap-2 border-b border-slate-300 pb-2">
            <button onclick="switchChapter('Kurikulum')" id="btn-chap-Kurikulum" class="chap-btn px-5 py-2.5 rounded-xl font-extrabold text-xs transition bg-[#1f7a9c] text-white shadow-xs flex items-center gap-2">
                <i class="fa-solid fa-book-open"></i> Bab 1: Kurikulum & Kelas
            </button>
            <button onclick="switchChapter('HEM')" id="btn-chap-HEM" class="chap-btn px-5 py-2.5 rounded-xl font-extrabold text-xs text-slate-600 hover:bg-slate-200 transition flex items-center gap-2">
                <i class="fa-solid fa-people-roof"></i> Bab 2: Hal Ehwal Murid
            </button>
            <button onclick="switchChapter('Pentadbiran')" id="btn-chap-Pentadbiran" class="chap-btn px-5 py-2.5 rounded-xl font-extrabold text-xs text-slate-600 hover:bg-slate-200 transition flex items-center gap-2">
                <i class="fa-solid fa-building-columns"></i> Bab 3: Pentadbiran & Bilik Khas
            </button>
            <button onclick="switchChapter('Kokurikulum')" id="btn-chap-Kokurikulum" class="chap-btn px-5 py-2.5 rounded-xl font-extrabold text-xs text-slate-600 hover:bg-slate-200 transition flex items-center gap-2">
                <i class="fa-solid fa-trophy"></i> Bab 4: Ko-Kurikulum
            </button>
        </div>

        <!-- SEKSYEN KANDUNGAN BAB -->
        <div id="chapter-content-container" class="space-y-6">
            <!-- Kad-kad jawatankuasa akan dijana di sini secara dinamik oleh JavaScript -->
        </div>

    </main>

    <script src="../../config.js"></script>

    <script>
    let ALL_STAF = [];
    let ALL_PERANAN = [];
    let ALL_LOKASI = [];
    let CURRENT_CHAPTER = 'Kurikulum';

    function showLoader(txt = "Memuatkan...") {
        document.getElementById('loader-text').innerText = txt;
        document.getElementById('global-loader').classList.remove('hidden');
    }

    function hideLoader() {
        document.getElementById('global-loader').classList.add('hidden');
    }

    async function postToBackend(payload) {
        const targetUrl = (typeof WEB_APP_URL !== 'undefined' && WEB_APP_URL) 
            ? WEB_APP_URL 
            : 'https://script.google.com/macros/s/AKfycbzjOd3r_56-OkWFiYEyTWhyYdoEbA6MXi5fgfIMDIRHRDVe3hzNHxjYUuitWSX_04hL/exec';

        const response = await fetch(targetUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            redirect: 'follow'
        });

        if (!response.ok) throw new Error('HTTP Error ' + response.status);
        return await response.json();
    }

    async function fetchPortalData() {
        showLoader('Membuka Buku Pengurusan...');
        try {
            const res = await postToBackend({ action: 'getManualV2Data' });
            hideLoader();

            if (res && res.success) {
                ALL_STAF = res.staf || [];
                ALL_PERANAN = res.peranan || [];
                ALL_LOKASI = res.lokasi || [];
                
                renderChapter();
            } else {
                Swal.fire('Ralat', res.error || 'Gagal menarik data.', 'error');
            }
        } catch (err) {
            hideLoader();
            Swal.fire('Ralat Sambungan', 'Gagal berhubung dengan backend.', 'error');
        }
    }

    function switchChapter(chap) {
        CURRENT_CHAPTER = chap;
        document.querySelectorAll('.chap-btn').forEach(btn => {
            btn.className = "chap-btn px-5 py-2.5 rounded-xl font-extrabold text-xs text-slate-600 hover:bg-slate-200 transition flex items-center gap-2";
        });
        document.getElementById(`btn-chap-${chap}`).className = "chap-btn px-5 py-2.5 rounded-xl font-extrabold text-xs transition bg-[#1f7a9c] text-white shadow-xs flex items-center gap-2";
        
        renderChapter();
    }

    function renderChapter() {
        const container = document.getElementById('chapter-content-container');
        container.innerHTML = '';

        if (CURRENT_CHAPTER === 'Kurikulum') {
            renderPengurusanKelasSection(container);
        } else if (CURRENT_CHAPTER === 'HEM') {
            renderKumpulanBertugasSection(container);
        } else if (CURRENT_CHAPTER === 'Pentadbiran') {
            renderBilikKhasSection(container);
        } else {
            container.innerHTML = `<div class="card-book p-8 text-center text-slate-400 font-bold">Bab Ko-Kurikulum Sedia Dikemas Kini</div>`;
        }
    }

    // 1. KAD KELAS (BAB 1: KURIKULUM)
    function renderPengurusanKelasSection(container) {
        const senaraiKelas = ALL_LOKASI.filter(l => String(l.Kategori).toLowerCase() === 'kelas');
        
        let html = `
            <div class="card-book p-6 space-y-4 border-l-8 border-l-[#1f7a9c]">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div>
                        <h2 class="font-extrabold text-lg text-slate-800">1.1 Pengurusan Kelas (Guru Kelas & Pembantu)</h2>
                        <p class="text-xs text-slate-500">Pilih guru terus pada peti kelas di bawah dan tekan Simpan.</p>
                    </div>
                    <button onclick="saveAllPengurusanKelas()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs rounded-xl shadow-xs transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan Pengurusan Kelas
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        `;

        senaraiKelas.forEach(kelas => {
            const namaKelas = kelas.Nama_Lokasi;
            
            // Cari guru kelas & pembantu sedia ada di Peranan_Staf
            const gk = ALL_PERANAN.find(p => p.Nama_Jawatankuasa === 'Pengurusan Kelas' && p.Peranan === 'Guru Kelas' && p.Skop_Tugas_Kelas === namaKelas);
            const gpk = ALL_PERANAN.find(p => p.Nama_Jawatankuasa === 'Pengurusan Kelas' && p.Peranan === 'Guru Pembantu' && p.Skop_Tugas_Kelas === namaKelas);

            html += `
                <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                        <span class="font-extrabold text-sm text-[#1f7a9c]"><i class="fa-solid fa-door-open mr-1.5"></i>${namaKelas}</span>
                        <span class="text-[10px] font-bold bg-slate-200 text-slate-600 px-2 py-0.5 rounded">${kelas.Tahap_Blok || 'Tahap'}</span>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Guru Kelas:</label>
                        <select id="select-gk-${namaKelas.replace(/\s+/g, '_')}" class="w-full p-2 text-xs border border-slate-300 rounded-lg bg-white font-semibold focus:border-[#1f7a9c]">
                            ${buildStafOptions(gk ? gk.ID_Staf : '')}
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Guru Pembantu Kelas:</label>
                        <select id="select-gpk-${namaKelas.replace(/\s+/g, '_')}" class="w-full p-2 text-xs border border-slate-300 rounded-lg bg-white font-semibold focus:border-[#1f7a9c]">
                            ${buildStafOptions(gpk ? gpk.ID_Staf : '')}
                        </select>
                    </div>
                </div>
            `;
        });

        html += `</div></div>`;
        container.innerHTML = html;
    }

    // 2. KAD JADUAL BERTUGAS (BAB 2: HEM)
    function renderKumpulanBertugasSection(container) {
        const kumpulanList = ['Kumpulan A', 'Kumpulan B', 'Kumpulan C', 'Kumpulan D'];

        let html = `
            <div class="card-book p-6 space-y-4 border-l-8 border-l-amber-500">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div>
                        <h2 class="font-extrabold text-lg text-slate-800">2.1 Jadual Kumpulan Bertugas Mingguan</h2>
                        <p class="text-xs text-slate-500">Tetapkan Ketua Kumpulan bagi setiap zon bertugas.</p>
                    </div>
                    <button onclick="saveAllKumpulanBertugas()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs rounded-xl shadow-xs transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan Jadual Bertugas
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        `;

        kumpulanList.forEach(kumpulan => {
            const ketua = ALL_PERANAN.find(p => p.Nama_Jawatankuasa === 'Jadual Bertugas Mingguan' && p.Peranan === 'Ketua Kumpulan' && p.Skop_Tugas_Kelas === kumpulan);

            html += `
                <div class="p-4 bg-amber-50/50 rounded-xl border border-amber-200 space-y-3">
                    <div class="font-extrabold text-sm text-amber-800 border-b border-amber-200 pb-2 flex items-center justify-between">
                        <span><i class="fa-solid fa-calendar-week mr-2"></i>${kumpulan}</span>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Ketua Kumpulan Bertugas:</label>
                        <select id="select-ketua-${kumpulan.replace(/\s+/g, '_')}" class="w-full p-2 text-xs border border-amber-300 rounded-lg bg-white font-semibold">
                            ${buildStafOptions(ketua ? ketua.ID_Staf : '')}
                        </select>
                    </div>
                </div>
            `;
        });

        html += `</div></div>`;
        container.innerHTML = html;
    }

    // 3. KAD BILIK KHAS (BAB 3: PENTADBIRAN)
    function renderBilikKhasSection(container) {
        const bilikKhas = ALL_LOKASI.filter(l => String(l.Kategori).toLowerCase() === 'bilik khas');

        let html = `
            <div class="card-book p-6 space-y-4 border-l-8 border-l-blue-600">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div>
                        <h2 class="font-extrabold text-lg text-slate-800">3.1 Penyelaras Bilik-Bilik Khas</h2>
                        <p class="text-xs text-slate-500">Agihan tanggungjawab bilik khas daripada Master_Kelas_Bilik.</p>
                    </div>
                    <button onclick="saveAllBilikKhas()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs rounded-xl shadow-xs transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan Penyelaras Bilik
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        `;

        bilikKhas.forEach(bilik => {
            const namaBilik = bilik.Nama_Lokasi;
            const penyelaras = ALL_PERANAN.find(p => p.Nama_Jawatankuasa === 'Penyelaras Bilik Khas' && p.Skop_Tugas_Kelas === namaBilik);

            html += `
                <div class="p-4 bg-blue-50/40 rounded-xl border border-blue-200 space-y-3">
                    <div class="font-extrabold text-sm text-blue-900 border-b border-blue-200 pb-2">
                        <i class="fa-solid fa-building mr-1.5"></i>${namaBilik}
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Penyelaras Bilik:</label>
                        <select id="select-bilik-${namaBilik.replace(/\s+/g, '_')}" class="w-full p-2 text-xs border border-blue-300 rounded-lg bg-white font-semibold">
                            ${buildStafOptions(penyelaras ? penyelaras.ID_Staf : '')}
                        </select>
                    </div>
                </div>
            `;
        });

        html += `</div></div>`;
        container.innerHTML = html;
    }

    // HELPER DROPDOWN OPTIONS STAF
    function buildStafOptions(selectedId = '') {
        let optHtml = '<option value="">-- Belum Dilantik --</option>';
        ALL_STAF.forEach(staf => {
            const id = String(staf.ID_Staf || '').trim();
            const nama = staf.Nama_Penuh || staf.Nama_Samaran || id;
            const isSelected = String(id).toLowerCase() === String(selectedId).toLowerCase() ? 'selected' : '';
            if (id) {
                optHtml += `<option value="${id}" ${isSelected}>${nama}</option>`;
            }
        });
        return optHtml;
    }

    // PROSES SIMPAN PENGURUSAN KELAS (BATCH)
    async function saveAllPengurusanKelas() {
        const senaraiKelas = ALL_LOKASI.filter(l => String(l.Kategori).toLowerCase() === 'kelas');
        let batchPayload = [];

        senaraiKelas.forEach(kelas => {
            const namaKelas = kelas.Nama_Lokasi;
            const cleanId = namaKelas.replace(/\s+/g, '_');
            const idGk = document.getElementById(`select-gk-${cleanId}`).value;
            const idGpk = document.getElementById(`select-gpk-${cleanId}`).value;

            batchPayload.push({
                kategori_pengurusan: 'Kurikulum',
                jk_induk: 'JK Induk Kurikulum',
                nama_jawatankuasa: 'Pengurusan Kelas',
                peranan: 'Guru Kelas',
                skop_tugas_kelas: namaKelas,
                id_staf: idGk,
                tahun: '2026',
                status: 'Aktif'
            });

            batchPayload.push({
                kategori_pengurusan: 'Kurikulum',
                jk_induk: 'JK Induk Kurikulum',
                nama_jawatankuasa: 'Pengurusan Kelas',
                peranan: 'Guru Pembantu',
                skop_tugas_kelas: namaKelas,
                id_staf: idGpk,
                tahun: '2026',
                status: 'Aktif'
            });
        });

        showLoader('Menyimpan Pengurusan Kelas...');
        try {
            const res = await postToBackend({ action: 'savePerananStafV2', data: batchPayload });
            hideLoader();
            if (res && res.success) {
                Swal.fire('Berjaya', 'Pengurusan Kelas berjaya dikemas kini!', 'success');
                fetchPortalData();
            } else {
                Swal.fire('Ralat', res.error, 'error');
            }
        } catch (e) {
            hideLoader();
            Swal.fire('Ralat', 'Gagal menyimpan data.', 'error');
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        fetchPortalData();
    });
    </script>
</body>
</html>
