<!DOCTYPE html>
<html lang="ms" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Manual Pengurusan Sekolah - SeMAKMUR</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons & SweetAlert2 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        tealTheme: '#1f7a9c',
                        tealDark: '#175d78',
                        tealLight: '#2ca2cd',
                        tealBg: '#eef6f9'
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        html, body { height: 100%; margin: 0; background-color: #EEF6F9; font-family: 'Plus Jakarta Sans', sans-serif; color: #2D3748; }
        .card-book { background: #FFFFFF; border-radius: 1rem; border: 1px solid #E2E8F0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.04); }
        .loader-ring { display: inline-block; position: relative; width: 44px; height: 44px; }
        .loader-ring div { box-sizing: border-box; display: block; position: absolute; width: 34px; height: 34px; margin: 5px; border: 3.5px solid #1f7a9c; border-radius: 50%; animation: loader-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite; border-color: #1f7a9c transparent transparent transparent; }
        @keyframes loader-ring { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#eef6f9] text-slate-800 h-full flex flex-col antialiased">

    <!-- GLOBAL LOADER -->
    <div id="global-loader" class="fixed inset-0 bg-slate-900/70 backdrop-blur-xs z-[9999] flex flex-col items-center justify-center transition-all duration-200">
        <div class="loader-ring mb-3"><div></div><div></div><div></div></div>
        <p class="text-white font-bold text-sm tracking-wide" id="loader-text">Memuatkan Buku Pengurusan...</p>
    </div>

    <!-- HEADER NAVIGATION BAR -->
    <header class="h-20 bg-white border-b border-slate-200 shrink-0 flex items-center justify-between px-6 z-20 shadow-xs">
        <div class="flex items-center gap-3">
            <a href="../DashboardGuru.html" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition flex items-center justify-center" title="Kembali ke Dashboard">
                <i class="fa-solid fa-arrow-left text-base"></i>
            </a>
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#1f7a9c] to-[#2ca2cd] text-white flex items-center justify-center text-xl shadow-xs font-bold">
                    📖
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-extrabold text-slate-800 tracking-tight leading-tight">Buku Manual Pengurusan Sekolah</h1>
                    <p class="text-[11px] text-[#1f7a9c] font-bold tracking-wide uppercase">Interactive Management Book & Roles Assignment</p>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="openNewCommitteeModal()" class="px-4 py-2 bg-[#1f7a9c] hover:bg-[#175d78] text-white font-extrabold text-xs rounded-xl transition flex items-center gap-2 shadow-xs">
                <i class="fa-solid fa-plus-circle"></i>
                <span>Cipta Jawatankuasa Baharu</span>
            </button>
        </div>
    </header>

    <!-- KANDUNGAN UTAMA PORTAL -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 max-w-7xl mx-auto w-full">

        <!-- NAVIGASI TAB BAB (CHAPTERS) -->
        <div class="flex flex-wrap items-center gap-2 border-b border-slate-300 pb-3">
            <button onclick="switchCategory('Pentadbiran')" id="tab-Pentadbiran" class="chap-btn px-5 py-2.5 rounded-xl font-extrabold text-xs transition bg-[#1f7a9c] text-white shadow-xs flex items-center gap-2">
                <i class="fa-solid fa-building-columns"></i> Bab 1: Pentadbiran
            </button>
            <button onclick="switchCategory('Kurikulum')" id="tab-Kurikulum" class="chap-btn px-5 py-2.5 rounded-xl font-extrabold text-xs text-slate-600 hover:bg-slate-200 transition flex items-center gap-2">
                <i class="fa-solid fa-book-open"></i> Bab 2: Kurikulum
            </button>
            <button onclick="switchCategory('HEM')" id="tab-HEM" class="chap-btn px-5 py-2.5 rounded-xl font-extrabold text-xs text-slate-600 hover:bg-slate-200 transition flex items-center gap-2">
                <i class="fa-solid fa-people-roof"></i> Bab 3: Hal Ehwal Murid
            </button>
            <button onclick="switchCategory('Kokurikulum')" id="tab-Kokurikulum" class="chap-btn px-5 py-2.5 rounded-xl font-extrabold text-xs text-slate-600 hover:bg-slate-200 transition flex items-center gap-2">
                <i class="fa-solid fa-trophy"></i> Bab 4: Ko-Kurikulum
            </button>
        </div>

        <!-- BEKAS KAD JAWATANKUASA DINAMIK -->
        <div id="cards-container" class="space-y-6">
            <!-- Kad Jawatankuasa akan dijana secara dinamik oleh JavaScript di sini -->
        </div>

    </main>

    <!-- MODAL PENAMBAHAN JAWATANKUASA BAHARU -->
    <div id="new-jk-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col">
            <div class="px-6 py-4 bg-[#1f7a9c] text-white flex items-center justify-between">
                <h3 class="font-extrabold text-sm sm:text-base">Tambah Kad Jawatankuasa Baharu</h3>
                <button onclick="closeNewCommitteeModal()" class="text-white/80 hover:text-white text-lg font-bold">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Kategori Pengurusan Bab</label>
                    <select id="modal-new-kategori" class="w-full p-2.5 text-xs border border-slate-300 rounded-lg bg-slate-50 font-bold focus:outline-none focus:border-[#1f7a9c]">
                        <option value="Pentadbiran">Pentadbiran</option>
                        <option value="Kurikulum">Kurikulum</option>
                        <option value="HEM">Hal Ehwal Murid (HEM)</option>
                        <option value="Kokurikulum">Ko-Kurikulum</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">JK Induk / Payung <span class="text-red-500">*</span></label>
                    <input type="text" id="modal-new-jk-induk" placeholder="Contoh: JK Induk Kurikulum" class="w-full p-2.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:border-[#1f7a9c]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Nama Jawatankuasa Baharu <span class="text-red-500">*</span></label>
                    <input type="text" id="modal-new-nama-jk" placeholder="Contoh: JK Keceriaan & Mampan" class="w-full p-2.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:border-[#1f7a9c]">
                </div>
                <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
                    <button type="button" onclick="closeNewCommitteeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-lg transition">Batal</button>
                    <button type="button" onclick="createCommitteeCard()" class="px-4 py-2 bg-[#1f7a9c] hover:bg-[#175d78] text-white font-bold text-xs rounded-lg transition">Cipta Kad</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PAUTAN KE CONFIG.JS DUA PARAS KELUAR FOLDER -->
    <script src="../../config.js"></script>

    <!-- LOGIK JAVASCRIPT UTAMA PORTAL BUKU INTERAKTIF -->
    <script>
    let ALL_STAF = [];
    let ALL_PERANAN = [];
    let ALL_LOKASI = [];
    let ACTIVE_CATEGORY = 'Pentadbiran';

    function showLoader(txt = "Memuatkan...") {
        document.getElementById('loader-text').innerText = txt;
        document.getElementById('global-loader').classList.remove('hidden');
    }

    function hideLoader() {
        document.getElementById('global-loader').classList.add('hidden');
    }

    async function postToBackend(payload) {
        const targetUrl = (typeof WEB_APP_URL !== 'undefined' && WEB_APP_URL) 
            ? WEB_APP_URL 
            : 'https://script.google.com/macros/s/AKfycbzjOd3r_56-OkWFiYEyTWhyYdoEbA6MXi5fgfIMDIRHRDVe3hzNHxjYUuitWSX_04hL/exec';

        const response = await fetch(targetUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            redirect: 'follow'
        });

        if (!response.ok) throw new Error('HTTP Error ' + response.status);
        return await response.json();
    }

    async function fetchPortalData() {
        showLoader('Menyelaraskan data pangkalan V2...');
        try {
            const res = await postToBackend({ action: 'getManualV2Data' });
            hideLoader();

            if (res && res.success) {
                ALL_STAF = res.staf || [];
                ALL_PERANAN = res.peranan || [];
                ALL_LOKASI = res.lokasi || [];
                
                renderChapter();
            } else {
                Swal.fire('Ralat', res.error || 'Gagal menarik data jawatankuasa.', 'error');
            }
        } catch (err) {
            hideLoader();
            console.error('Fetch error:', err);
            Swal.fire('Ralat Sambungan', 'Gagal berhubung dengan backend.', 'error');
        }
    }

    function switchCategory(cat) {
        ACTIVE_CATEGORY = cat;
        document.querySelectorAll('.chap-btn').forEach(btn => {
            btn.className = "chap-btn px-5 py-2.5 rounded-xl font-extrabold text-xs text-slate-600 hover:bg-slate-200 transition flex items-center gap-2";
        });

        const activeBtn = document.getElementById(`tab-${cat}`);
        if (activeBtn) {
            activeBtn.className = "chap-btn px-5 py-2.5 rounded-xl font-extrabold text-xs transition bg-[#1f7a9c] text-white shadow-xs flex items-center gap-2";
        }

        renderChapter();
    }

    function renderChapter() {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        // Tentukan data bagi Kategori (Bab) yang sedang aktif
        const filteredPeranan = ALL_PERANAN.filter(p => String(p.Kategori_Pengurusan).toLowerCase().trim() === ACTIVE_CATEGORY.toLowerCase().trim());

        // Kumpulkan mengikut Nama_Jawatankuasa
        const groupedMap = new Map();

        // 1. Jika Bab Kurikulum, pastikan 'Pengurusan Kelas' diwujudkan dengan mengambil lokasi dari Master_Kelas_Bilik
        if (ACTIVE_CATEGORY === 'Kurikulum') {
            groupedMap.set('Pengurusan Kelas', {
                jkInduk: 'JK Induk Kurikulum',
                isSpecialClassCard: true,
                items: filteredPeranan.filter(p => p.Nama_Jawatankuasa === 'Pengurusan Kelas')
            });
        }

        // 2. Kumpulkan jawatankuasa lain yang wujud dalam Peranan_Staf
        filteredPeranan.forEach(item => {
            const namaJk = item.Nama_Jawatankuasa || 'Jawatankuasa Am';
            if (!groupedMap.has(namaJk)) {
                groupedMap.set(namaJk, {
                    jkInduk: item.JK_Induk || `JK Induk ${ACTIVE_CATEGORY}`,
                    isSpecialClassCard: false,
                    items: []
                });
            }
            groupedMap.get(namaJk).items.push(item);
        });

        if (groupedMap.size === 0) {
            container.innerHTML = `
                <div class="card-book p-10 text-center space-y-3">
                    <p class="text-slate-400 font-extrabold text-sm">Tiada Kad Jawatankuasa di bawah Bab ${ACTIVE_CATEGORY} lagi.</p>
                    <button onclick="openNewCommitteeModal()" class="px-4 py-2 bg-[#1f7a9c] text-white font-bold text-xs rounded-xl shadow-xs">
                        + Cipta Jawatankuasa Pertama Bab Ini
                    </button>
                </div>
            `;
            return;
        }

        // Lukis Setiap Kad Jawatankuasa
        groupedMap.forEach((groupData, namaJk) => {
            if (groupData.isSpecialClassCard) {
                renderPengurusanKelasCard(container, namaJk, groupData);
            } else {
                renderStandardCommitteeCard(container, namaJk, groupData);
            }
        });
    }

    // A. KAD KHAS: PENGURUSAN KELAS (DARI MASTER_KELAS_BILIK)
    function renderPengurusanKelasCard(container, namaJk, groupData) {
        const senaraiKelas = ALL_LOKASI.filter(l => String(l.Kategori).toLowerCase() === 'kelas');
        const cleanCardId = 'card-' + namaJk.replace(/\s+/g, '_');

        let cardHtml = `
            <div id="${cleanCardId}" class="card-book p-6 space-y-4 border-l-8 border-l-[#1f7a9c]" data-jk="${namaJk}" data-jkinduk="${groupData.jkInduk}">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-slate-100 pb-3 gap-3">
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 class="font-extrabold text-lg text-slate-800">${namaJk}</h2>
                            <span class="px-2.5 py-0.5 bg-teal-100 text-[#1f7a9c] font-bold text-[10px] rounded-full">${groupData.jkInduk}</span>
                        </div>
                        <p class="text-xs text-slate-500 font-medium mt-0.5">Penetapan Guru Kelas & Pembantu terus mengikut Master_Kelas_Bilik.</p>
                    </div>
                    <button onclick="saveCardData('${cleanCardId}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs rounded-xl shadow-xs transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan Kad Ini
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        `;

        senaraiKelas.forEach(kelas => {
            const namaKelas = kelas.Nama_Lokasi;
            const gk = groupData.items.find(p => p.Peranan === 'Guru Kelas' && p.Skop_Tugas_Kelas === namaKelas);
            const gpk = groupData.items.find(p => p.Peranan === 'Guru Pembantu' && p.Skop_Tugas_Kelas === namaKelas);

            cardHtml += `
                <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                        <span class="font-extrabold text-sm text-[#1f7a9c]"><i class="fa-solid fa-door-open mr-1.5"></i>${namaKelas}</span>
                        <span class="text-[10px] font-bold bg-slate-200 text-slate-600 px-2 py-0.5 rounded">${kelas.Tahap_Blok || 'Kelas'}</span>
                    </div>

                    <div class="space-y-2">
                        <div class="card-row-item" data-peranan="Guru Kelas" data-skop="${namaKelas}">
                            <label class="block text-[11px] font-bold text-slate-600 mb-1">Guru Kelas:</label>
                            <select class="select-staf w-full p-2 text-xs border border-slate-300 rounded-lg bg-white font-semibold focus:border-[#1f7a9c]">
                                ${buildStafOptions(gk ? gk.ID_Staf : '')}
                            </select>
                        </div>

                        <div class="card-row-item" data-peranan="Guru Pembantu" data-skop="${namaKelas}">
                            <label class="block text-[11px] font-bold text-slate-600 mb-1">Guru Pembantu Kelas:</label>
                            <select class="select-staf w-full p-2 text-xs border border-slate-300 rounded-lg bg-white font-semibold focus:border-[#1f7a9c]">
                                ${buildStafOptions(gpk ? gpk.ID_Staf : '')}
                            </select>
                        </div>
                    </div>
                </div>
            `;
        });

        cardHtml += `</div></div>`;
        container.insertAdjacentHTML('beforeend', cardHtml);
    }

    // B. KAD STANDARD: JAWATANKUASA AM (CTH: JK DIGITAL, JK PBD, JK PSS)
    function renderStandardCommitteeCard(container, namaJk, groupData) {
        const cleanCardId = 'card-' + namaJk.replace(/\s+/g, '_');

        let cardHtml = `
            <div id="${cleanCardId}" class="card-book p-6 space-y-4 border-l-8 border-l-amber-500" data-jk="${namaJk}" data-jkinduk="${groupData.jkInduk}">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-slate-100 pb-3 gap-3">
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 class="font-extrabold text-lg text-slate-800">${namaJk}</h2>
                            <span class="px-2.5 py-0.5 bg-amber-100 text-amber-800 font-bold text-[10px] rounded-full">${groupData.jkInduk}</span>
                        </div>
                        <p class="text-xs text-slate-500 font-medium mt-0.5">Senarai peranan dan pegawai dilantik dalam jawatankuasa.</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="addCardRow('${cleanCardId}')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition flex items-center gap-1.5">
                            <i class="fa-solid fa-plus text-xs"></i> Tambah Peranan
                        </button>
                        <button onclick="saveCardData('${cleanCardId}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs rounded-xl shadow-xs transition flex items-center gap-2">
                            <i class="fa-solid fa-floppy-disk"></i> Simpan Kad Ini
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                                <th class="p-2.5 w-1/4">Peranan / Jawatan</th>
                                <th class="p-2.5 w-1/4">Skop / Sub-Unit / Bilik</th>
                                <th class="p-2.5 w-2/5">Pegawai Dilantik (Master_Staf)</th>
                                <th class="p-2.5 text-center w-12">Tindakan</th>
                            </tr>
                        </thead>
                        <tbody class="rows-holder divide-y divide-slate-100 font-medium">
        `;

        if (groupData.items.length === 0) {
            cardHtml += generateRowHtml('', '', '');
        } else {
            groupData.items.forEach(item => {
                cardHtml += generateRowHtml(item.Peranan, item.Skop_Tugas_Kelas, item.ID_Staf, item.ID_Peranan);
            });
        }

        cardHtml += `
                        </tbody>
                    </table>
                </div>
            </div>
        `;

        container.insertAdjacentHTML('beforeend', cardHtml);
    }

    function generateRowHtml(peranan = '', skop = '', selectedStafId = '', idPeranan = '') {
        return `
            <tr class="card-row-item hover:bg-slate-50 transition" data-idperanan="${idPeranan}">
                <td class="p-2">
                    <input type="text" class="input-peranan w-full p-2 text-xs border border-slate-200 rounded-lg font-bold focus:border-[#1f7a9c]" value="${peranan}" placeholder="Contoh: Setiausaha / Penyelaras">
                </td>
                <td class="p-2">
                    <input type="text" class="input-skop w-full p-2 text-xs border border-slate-200 rounded-lg focus:border-[#1f7a9c]" value="${skop}" placeholder="Contoh: PBD / Laman Web / Makmal ICT">
                </td>
                <td class="p-2">
                    <select class="select-staf w-full p-2 text-xs border border-slate-200 rounded-lg bg-white font-semibold focus:border-[#1f7a9c]">
                        ${buildStafOptions(selectedStafId)}
                    </select>
                </td>
                <td class="p-2 text-center">
                    <button onclick="deleteCardRow(this)" class="p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg transition" title="Hapus Baris">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                </td>
            </tr>
        `;
    }

    function buildStafOptions(selectedId = '') {
        let optHtml = '<option value="">-- Belum Dilantik --</option>';
        ALL_STAF.forEach(staf => {
            const id = String(staf.ID_Staf || '').trim();
            const nama = staf.Nama_Penuh || staf.Nama_Samaran || id;
            const isSelected = String(id).toLowerCase() === String(selectedId).toLowerCase() ? 'selected' : '';
            if (id) {
                optHtml += `<option value="${id}" ${isSelected}>${nama} (${id})</option>`;
            }
        });
        return optHtml;
    }

    function addCardRow(cardId) {
        const card = document.getElementById(cardId);
        if (!card) return;
        const tbody = card.querySelector('.rows-holder');
        if (tbody) {
            tbody.insertAdjacentHTML('beforeend', generateRowHtml());
        }
    }

    function deleteCardRow(btn) {
        const row = btn.closest('tr');
        if (row) row.remove();
    }

    // PROSES SIMPAN DATA SATU KAD KE BACKEND
    async function saveCardData(cardId) {
        const card = document.getElementById(cardId);
        if (!card) return;

        const namaJk = card.getAttribute('data-jk');
        const jkInduk = card.getAttribute('data-jkinduk');
        const rowItems = card.querySelectorAll('.card-row-item');

        let payloadBatch = [];

        rowItems.forEach(row => {
            let peranan = '';
            let skop = '';
            let idStaf = '';
            let idPeranan = row.getAttribute('data-idperanan') || '';

            if (row.hasAttribute('data-peranan')) {
                // Mod Kad Pengurusan Kelas
                peranan = row.getAttribute('data-peranan');
                skop = row.getAttribute('data-skop');
            } else {
                // Mod Kad Standard
                const perananInput = row.querySelector('.input-peranan');
                const skopInput = row.querySelector('.input-skop');
                peranan = perananInput ? perananInput.value.trim() : '';
                skop = skopInput ? skopInput.value.trim() : '';
            }

            const selectStaf = row.querySelector('.select-staf');
            idStaf = selectStaf ? selectStaf.value : '';

            if (peranan || idStaf) {
                payloadBatch.push({
                    id_peranan: idPeranan,
                    kategori_pengurusan: ACTIVE_CATEGORY,
                    jk_induk: jkInduk,
                    nama_jawatankuasa: namaJk,
                    peranan: peranan,
                    skop_tugas_kelas: skop,
                    id_staf: idStaf,
                    tahun: '2026',
                    status: 'Aktif'
                });
            }
        });

        showLoader(`Menyimpan Kad ${namaJk}...`);
        try {
            const res = await postToBackend({ action: 'savePerananStafV2', data: payloadBatch });
            hideLoader();

            if (res && res.success) {
                Swal.fire('Berjaya', `Jawatankuasa ${namaJk} berjaya disimpan!`, 'success');
                fetchPortalData();
            } else {
                Swal.fire('Ralat', res.error || 'Gagal menyimpan rekod.', 'error');
            }
        } catch (err) {
            hideLoader();
            Swal.fire('Ralat', 'Gagal menyimpan data ke pangkalan data.', 'error');
        }
    }

    // PENAMBAHAN KAD JAWATANKUASA BAHARU
    function openNewCommitteeModal() {
        document.getElementById('modal-new-kategori').value = ACTIVE_CATEGORY;
        document.getElementById('modal-new-jk-induk').value = `JK Induk ${ACTIVE_CATEGORY}`;
        document.getElementById('modal-new-nama-jk').value = '';
        document.getElementById('new-jk-modal').classList.remove('hidden');
    }

    function closeNewCommitteeModal() {
        document.getElementById('new-jk-modal').classList.add('hidden');
    }

    function createCommitteeCard() {
        const kat = document.getElementById('modal-new-kategori').value;
        const jkInduk = document.getElementById('modal-new-jk-induk').value.trim();
        const namaJk = document.getElementById('modal-new-nama-jk').value.trim();

        if (!namaJk || !jkInduk) {
            Swal.fire('Perhatian', 'Sila isi nama jawatankuasa dan JK Induk.', 'warning');
            return;
        }

        closeNewCommitteeModal();

        // Jika kategori berbeza dengan tab aktif, tukar ke tab tersebut
        if (kat !== ACTIVE_CATEGORY) {
            switchCategory(kat);
        }

        const container = document.getElementById('cards-container');
        renderStandardCommitteeCard(container, namaJk, { jkInduk: jkInduk, items: [] });
    }

    window.addEventListener('DOMContentLoaded', () => {
        fetchPortalData();
    });
    </script>
</body>
</html>
