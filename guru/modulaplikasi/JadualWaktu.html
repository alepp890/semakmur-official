<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Portal Jadual Waktu Sekolah - aSc Grid Print Style</title>
  <style>
    /* ================= PALET WARNA & RUPA aSc PRINT STYLES ================= */
    :root {
      --asc-border: #000000;
      --asc-bg-header: #f8f9fa;
      --asc-font-family: 'Arial', sans-serif;
    }

    body {
      font-family: var(--asc-font-family);
      background-color: #f3f4f6;
      margin: 0;
      padding: 15px;
      color: #111827;
    }

    .container-asc {
      max-width: 1250px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* BAR ALATAN & BUTANG PRINT */
    .toolbar-asc {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e5e7eb;
    }

    .btn-asc {
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #d1d5db;
      background: #0284c7;
      color: white;
    }

    .btn-asc:hover { background: #0369a1; }

    /* LAYOUT CETAKAN aSc A4 LANDSCAPE */
    .asc-timetable-card {
      border: 2px solid var(--asc-border);
      padding: 12px;
      background: #ffffff;
      margin-bottom: 30px;
      page-break-after: always;
    }

    .asc-header-title {
      text-align: center;
      margin-bottom: 8px;
    }

    .asc-header-title h2 {
      margin: 0;
      font-size: 18px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .asc-header-title p {
      margin: 2px 0 8px 0;
      font-size: 12px;
      color: #374151;
    }

    /* JADUAL GRID MATRIKS UTAMA */
    table.asc-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 11px;
    }

    table.asc-table th, table.asc-table td {
      border: 1px solid var(--asc-border);
      text-align: center;
      vertical-align: middle;
      padding: 4px 2px;
      height: 48px;
      word-wrap: break-word;
    }

    table.asc-table th {
      background-color: #f1f5f9;
      font-weight: bold;
      font-size: 10px;
    }

    .cell-rehat {
      background-color: #ffffff;
      font-weight: bold;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      letter-spacing: 2px;
      font-size: 11px;
    }

    .cell-pdp {
      font-weight: bold;
      font-size: 12px;
    }

    .subjek-code { font-size: 13px; font-weight: bold; }
    .guru-samaran { font-size: 9px; font-weight: normal; margin-top: 2px; color: #1f2937; }

    /* PANEL STATISTIK / RUMUSAN DI BAWAH JADUAL */
    .asc-bottom-summary {
      display: flex;
      margin-top: 10px;
      gap: 15px;
    }

    .asc-stat-table {
      width: 45%;
      border-collapse: collapse;
      font-size: 10px;
      margin-left: auto;
    }

    .asc-stat-table th, .asc-stat-table td {
      border: 1px solid var(--asc-border);
      padding: 3px 6px;
      text-align: left;
    }

    /* CETAKAN A4 LANDSCAPE STYLES */
    @media print {
      @page {
        size: A4 landscape;
        margin: 8mm;
      }
      body {
        padding: 0;
        background: none;
      }
      .container-asc {
        box-shadow: none;
        padding: 0;
        max-width: 100%;
      }
      .toolbar-asc, .no-print {
        display: none !important;
      }
      .asc-timetable-card {
        border: 2px solid #000;
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>

<div class="container-asc">
  <div class="toolbar-asc">
    <div>
      <label><strong>Pilih Mod Paparan:</strong></label>
      <select id="viewTypeSelect" onchange="renderTimetableUI()" style="padding: 5px;">
        <option value="Guru">Jadual Mengajar Guru</option>
        <option value="Kelas">Jadual Waktu Kelas</option>
        <option value="MasterGrid">Master Grid Overall (aSc View)</option>
      </select>

      <label style="margin-left: 15px;"><strong>Pilih Nama / Kelas:</strong></label>
      <select id="entityFilterSelect" onchange="renderTimetableUI()" style="padding: 5px;"></select>
    </div>
    <div>
      <button class="btn-asc" onclick="window.print()">🖨️ Cetak A4 Landscape</button>
    </div>
  </div>

  <div id="timetableOutputArea"></div>
</div>

<script>
  let RAW_HASIL_JADUAL = [];
  let RAW_MASTER_STAF = [];
  let MAP_NAMA_SAMARAN = {};

  window.onload = function() {
    loadAllDataFromBackend();
  };

  function loadAllDataFromBackend() {
    google.script.run.withSuccessHandler(res => {
      if (res && res.success) {
        RAW_HASIL_JADUAL = res.data || [];
        loadMasterStaf();
      }
    }).getJadualWaktuHasil({});
  }

  function loadMasterStaf() {
    google.script.run.withSuccessHandler(res => {
      RAW_MASTER_STAF = res || [];
      RAW_MASTER_STAF.forEach(s => {
        const full = s.Nama_Guru || s.Nama || s.Nama_Penuh;
        const samaran = s.Nama_Samaran || s.Samaran || full;
        if (full) MAP_NAMA_SAMARAN[full] = samaran;
      });
      populateEntityOptions();
      renderTimetableUI();
    }).getMasterStafData({});
  }

  function getSamaran(namaFull) {
    if (!namaFull) return '';
    return MAP_NAMA_SAMARAN[namaFull] || namaFull.split(' ')[0];
  }

  function populateEntityOptions() {
    const viewType = document.getElementById('viewTypeSelect').value;
    const select = document.getElementById('entityFilterSelect');
    select.innerHTML = '';

    if (viewType === 'Guru') {
      const guruList = [...new Set(RAW_HASIL_JADUAL.map(i => i.ID_Guru_Utama).concat(RAW_HASIL_JADUAL.map(i => i.ID_Guru_Pair)))].filter(g => g && g !== 'ALL_GURU' && g !== 'REHAT').sort();
      guruList.forEach(g => select.add(new Option(g, g)));
    } else if (viewType === 'Kelas') {
      const kelasList = [...new Set(RAW_HASIL_JADUAL.map(i => i.ID_Kelas))].filter(k => k && k !== 'ALL').sort();
      kelasList.forEach(k => select.add(new Option(k, k)));
    } else {
      select.add(new Option('-- SEMUA (MASTER GRID) --', 'ALL'));
    }
  }

  function renderTimetableUI() {
    const viewType = document.getElementById('viewTypeSelect').value;
    const selectedEntity = document.getElementById('entityFilterSelect').value;
    const outputDiv = document.getElementById('timetableOutputArea');
    outputDiv.innerHTML = '';

    if (viewType === 'Guru') {
      outputDiv.innerHTML = buildSingleTableHTML('Guru', selectedEntity);
    } else if (viewType === 'Kelas') {
      outputDiv.innerHTML = buildSingleTableHTML('Kelas', selectedEntity);
    }
  }

  function buildSingleTableHTML(type, entityName) {
    const isGuru = (type === 'Guru');
    const filteredRows = RAW_HASIL_JADUAL.filter(r => {
      if (isGuru) return r.ID_Guru_Utama === entityName || r.ID_Guru_Pair === entityName;
      return r.ID_Kelas === entityName;
    });

    const days = ['Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat'];
    // 13 Lajur Grid aSc: 1, 2, 3, 4, REHAT1, 5, REHAT2, 6, 7, 8, 9, 10, 11
    const gridCols = [
      { id: '1', label: '1<br>7:40-8:10' },
      { id: '2', label: '2<br>8:10-8:40' },
      { id: '3', label: '3<br>8:40-9:10' },
      { id: '4', label: '4<br>9:10-9:40' },
      { id: 'R1', label: 'REHAT1<br>9:40-10:00', isRehat: true },
      { id: '5', label: '5<br>10:00-10:30' },
      { id: 'R2', label: 'REHAT2<br>10:10-10:30', isRehat: true },
      { id: '6', label: '6<br>10:30-11:00' },
      { id: '7', label: '7<br>11:00-11:30' },
      { id: '8', label: '8<br>11:30-12:00' },
      { id: '9', label: '9<br>12:00-12:30' },
      { id: '10', label: '10<br>12:30-13:00' },
      { id: '11', label: '11<br>13:00-13:30' }
    ];

    let html = `
      <div class="asc-timetable-card">
        <div class="asc-header-title">
          <h2>JADUAL WAKTU: ${entityName}</h2>
          <p>SEKOLAH KEBANGSAAN SEGAMBUT MAKMUR | aSc Timetable Grid View</p>
        </div>

        <table class="asc-table">
          <thead>
            <tr>
              <th style="width: 60px;">HARI</th>
              ${gridCols.map(c => `<th>${c.label}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
    `;

    // Kira Statistik Subjek
    const statMap = {};
    let totalWaktu = 0;

    days.forEach((hari, dIdx) => {
      html += `<tr><td style="font-weight:bold; background:#f8fafc;">${hari}</td>`;

      for (let cIdx = 0; cIdx < gridCols.length; cIdx++) {
        const col = gridCols[cIdx];

        if (col.isRehat) {
          if (dIdx === 0) {
            html += `<td rowspan="5" class="cell-rehat">${col.id === 'R1' ? 'REHAT 1' : 'REHAT 2'}</td>`;
          }
          continue;
        }

        // Semak Slot Match
        const match = filteredRows.find(r => r.Hari === hari && r.Slot_ID.includes(`SLOT-${col.id.padStart(2, '0')}`));

        if (match) {
          totalWaktu++;
          const subKey = match.Kod_Subjek || match.ID_Subjek;
          statMap[subKey] = (statMap[subKey] || 0) + 1;

          // Format Nama Guru Co-Teaching
          let guruDisplay = getSamaran(match.ID_Guru_Utama);
          if (match.ID_Guru_Pair) {
            guruDisplay = `${getSamaran(match.ID_Guru_Utama)} /<br>${getSamaran(match.ID_Guru_Pair)}`;
          }

          const labelBox = isGuru ? match.ID_Kelas : `${match.Kod_Subjek}<br><span class="guru-samaran">${guruDisplay}</span>`;

          html += `<td class="cell-pdp"><div class="subjek-code">${labelBox}</div></td>`;
        } else {
          html += `<td>-</td>`;
        }
      }

      html += `</tr>`;
    });

    html += `
          </tbody>
        </table>

        <!-- PANEL STATISTIK DI BAWAH JADUAL -->
        <div class="asc-bottom-summary">
          <div style="font-size: 10px; color: #4b5563;">
            Jadual waktu dijana secara automatik.<br>Tarikh Cetakan: ${new Date().toLocaleDateString('ms-MY')}
          </div>
          <table class="asc-stat-table">
            <thead>
              <tr><th>Subjek</th><th style="width: 50px; text-align:center;">Jumlah Waktu</th></tr>
            </thead>
            <tbody>
              ${Object.keys(statMap).map(k => `<tr><td>${k}</td><td style="text-align:center;">${statMap[k]}</td></tr>`).join('')}
              <tr style="font-weight:bold; background:#f3f4f6;"><td>JUMLAH KESELURUHAN</td><td style="text-align:center;">${totalWaktu}</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    `;

    return html;
  }
</script>

</body>
</html>
